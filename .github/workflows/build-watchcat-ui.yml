name: Build LuCI Watchcat ipks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout this repo (openwrt/luci fork)
        uses: actions/checkout@v5

      - name: Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file curl git

      - name: Build po2lmo host tool
        run: |
          SRC=$(find modules/luci-base -name po2lmo.c | head -n1)
          test -n "$SRC" || { echo "ERROR: po2lmo.c not found"; exit 1; }
          gcc -O2 -o /tmp/po2lmo "$SRC"

      - name: Package app + zh-cn/zh-tw ipks
        run: |
          set -e
          APP="applications/luci-app-watchcat"
          VER="git-$(git show -s --format=%cd --date=format:%y.%j HEAD)-$(git rev-parse --short HEAD)"
          mkdir -p out

          make_ipk() {
            local pkg="$1" ver="$2" deps="$3" data="$4" outfile="$5"
            local tmp; tmp="$(mktemp -d)"
            mkdir -p "$tmp/ctrl"
            {
              printf 'Package: %s\n' "$pkg"
              printf 'Version: %s\n' "$ver"
              printf 'Architecture: all\n'
              printf 'Section: luci\n'
              printf 'Priority: optional\n'
              printf 'Depends: %s\n' "$deps"
              printf 'Description: LuCI Watchcat (openwrt/luci fork)\n'
            } > "$tmp/ctrl/control"
            ( cd "$data" && tar czf "$tmp/data.tar.gz" . )
            ( cd "$tmp/ctrl" && tar czf "$tmp/control.tar.gz" . )
            printf '2.0\n' > "$tmp/debian-binary"
            ( cd "$tmp" && tar czf "$outfile" ./debian-binary ./control.tar.gz ./data.tar.gz )
            echo "built: $outfile"
            rm -rf "$tmp"
          }

          mkdir -p app_data
          if [ -d "$APP/htdocs" ]; then cp -r "$APP/htdocs" app_data/www; fi
          if [ -d "$APP/root" ]; then cp -r "$APP/root/." app_data/; fi
          if [ -d "$APP/luasrc" ]; then
            mkdir -p app_data/usr/lib/lua/luci
            cp -r "$APP/luasrc/." app_data/usr/lib/lua/luci/
          fi
          make_ipk "luci-app-watchcat" "$VER" "luci-base, watchcat" \
            "app_data" "$PWD/out/luci-app-watchcat_${VER}_all.ipk"

          for lang in zh-cn zh-tw; do
            case "$lang" in
              zh-cn) PO="$(find "$APP/po" -type f -name '*.po' -path '*zh*cn*' | head -n1)";;
              zh-tw) PO="$(find "$APP/po" -type f -name '*.po' -path '*zh*tw*' | head -n1)";;
            esac
            test -n "$PO" || { echo "ERROR: no .po for $lang"; exit 1; }
            mkdir -p i18n_data/usr/lib/lua/luci/i18n
            /tmp/po2lmo "$PO" "i18n_data/usr/lib/lua/luci/i18n/watchcat.${lang}.lmo"
            make_ipk "luci-i18n-watchcat-${lang}" "$VER" "luci-app-watchcat" \
              "i18n_data" "$PWD/out/luci-i18n-watchcat-${lang}_${VER}_all.ipk"
            rm -rf i18n_data
          done
          ls -l out
          sha256sum out/*.ipk

      - name: Upload LuCI ipks
        uses: actions/upload-artifact@v4
        with:
          name: luci-ipks
          path: out/*.ipk
          if-no-files-found: error
