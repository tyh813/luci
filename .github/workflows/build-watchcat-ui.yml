name: Build LuCI Watchcat ipks

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file curl git
          gcc --version | head -n1

      - name: Build po2lmo host tool
        run: |
          set -e
          PO2LMO=$(find . -name po2lmo.c | head -n1)
          test -n "$PO2LMO" || { echo "ERROR: po2lmo.c not found"; exit 1; }
          SRC_DIR=$(dirname "$PO2LMO")
          # sfh_hash (SuperFastHash) lives in lib/lmo.c, which includes
          # plural_formula.h -- that header is lemon-generated from
          # lib/plural_formula.y at build time. Mirror upstream
          # modules/luci-base/src/Makefile:
          #   po2lmo: po2lmo.o lib/lmo.o lib/plural_formula.o
          # lemon must live in contrib/ : at runtime it looks for lempar.c
          # next to argv[0] (tplt_open -> pathsearch), same as upstream.
          cc -std=gnu17 -o "$SRC_DIR/contrib/lemon" "$SRC_DIR/contrib/lemon.c"
          ( cd "$SRC_DIR" && ./contrib/lemon -q lib/plural_formula.y )
          gcc -O2 -I"$SRC_DIR" -I"$SRC_DIR/lib" -o /tmp/po2lmo \
            "$PO2LMO" "$SRC_DIR/lib/lmo.c" "$SRC_DIR/lib/plural_formula.c"
          test -x /tmp/po2lmo || { echo "ERROR: po2lmo build failed"; exit 1; }

      - name: Package app + zh-cn/zh-tw ipks
        run: |
          set -e
          APP="applications/luci-app-watchcat"
          test -d "$APP" || { echo "ERROR: $APP missing"; exit 1; }
          VER="git-$(git show -s --format=%cd --date=format:%y.%j HEAD)-$(git rev-parse --short HEAD)"
          mkdir -p out

          make_ipk() {
            local pkg="$1" ver="$2" deps="$3" data="$4" outfile="$5"
            local tmp; tmp="$(mktemp -d)"
            mkdir -p "$tmp/ctrl"
            {
              printf 'Package: %s\n' "$pkg"
              printf 'Version: %s\n' "$ver"
              printf 'Architecture: all\n'
              printf 'Section: luci\n'
              printf 'Priority: optional\n'
              printf 'Depends: %s\n' "$deps"
              printf 'Description: LuCI Watchcat (built from openwrt/luci fork)\n'
            } > "$tmp/ctrl/control"
            ( cd "$data" && tar czf "$tmp/data.tar.gz" . )
            ( cd "$tmp/ctrl" && tar czf "$tmp/control.tar.gz" . )
            printf '2.0\n' > "$tmp/debian-binary"
            ( cd "$tmp" && tar czf "$outfile" ./debian-binary ./control.tar.gz ./data.tar.gz )
            echo "built: $outfile"
            rm -rf "$tmp"
          }

          mkdir -p app_data
          if [ -d "$APP/htdocs" ]; then cp -r "$APP/htdocs" app_data/www; fi
          if [ -d "$APP/root" ]; then cp -r "$APP/root/." app_data/; fi
          if [ -d "$APP/luasrc" ]; then
            mkdir -p app_data/usr/lib/lua/luci
            cp -r "$APP/luasrc/." app_data/usr/lib/lua/luci/
          fi
          make_ipk "luci-app-watchcat" "$VER" "luci-base, watchcat" \
            "app_data" "$PWD/out/luci-app-watchcat_${VER}_all.ipk"

          # po/ dirs are zh_Hans / zh_Hant. LuCI loads watchcat.zh-cn.lmo /
          # watchcat.zh-tw.lmo (luci.mk LUCI_LC_ALIAS), so the output name stays
          # zh-cn / zh-tw - only the source glob had to change.
          for lang in zh-cn zh-tw; do
            case "$lang" in
              zh-cn) PO="$(find "$APP/po" -type f -name '*.po' -path '*zh_Hans*' | head -n1)";;
              zh-tw) PO="$(find "$APP/po" -type f -name '*.po' -path '*zh_Hant*' | head -n1)";;
            esac
            test -n "$PO" || { echo "ERROR: no .po for $lang"; exit 1; }
            echo "using po: $PO"
            mkdir -p "i18n_data/usr/lib/lua/luci/i18n"
            /tmp/po2lmo "$PO" "i18n_data/usr/lib/lua/luci/i18n/watchcat.${lang}.lmo"
            make_ipk "luci-i18n-watchcat-${lang}" "$VER" "luci-app-watchcat" \
              "i18n_data" "$PWD/out/luci-i18n-watchcat-${lang}_${VER}_all.ipk"
            rm -rf i18n_data
          done

          ls -l out
          sha256sum out/*.ipk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-watchcat-ipks
          path: out/*.ipk
          if-no-files-found: error
